name = "businessosbackend"
main = "src/index.ts"
compatibility_date = "2026-07-11"
compatibility_flags = ["nodejs_compat"]

# Edge-distributed by default — correct across the whole Workers fleet with
# no shared store needed, unlike the old in-memory Fastify rate limiter this
# replaces. `namespace_id` just needs to be a positive integer unique to this
# account; adjust if Cloudflare's current tooling wants a different value.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
[ratelimits.simple]
limit = 300
period = 60

# H6 fix (2026-08-04 security assessment, closed 2026-08-06): a second,
# dedicated limiter for POST /api/auth/login specifically, keyed by
# normalized email rather than IP (Cloudflare's own guidance — many
# legitimate users share an IP). This is the fast, cheap, always-on
# volumetric guard; the precise 5-attempts/15-minute account lockout is the
# KV-backed logic in src/lib/loginAttempts.ts below, since the Rate Limiting
# binding's period is capped at 60s and can't express a 15-minute window on
# its own. namespace_id just needs to be a positive integer unique to this
# account, distinct from RATE_LIMITER's above.
[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 10
period = 60

# Backs src/lib/loginAttempts.ts's real 5-attempts/15-minute account lockout
# — the server-side, unbypassable version of frontend/src/lib/
# loginAttempts.ts's identical client-side policy. Eventually consistent
# (Cloudflare KV's own model — up to ~60s propagation across edge
# locations), which is an accepted tradeoff for slowing/deterring brute
# force, not a claim of atomic exactness.
[[kv_namespaces]]
binding = "LOGIN_ATTEMPTS"
id = "be17a34a2b094a12820b91e69e76fe43"
preview_id = "b0be2145cb1f47b6b07473e995040d26"

# SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY / ALLOWED_ORIGIN /
# RESEND_API_KEY are all set via `wrangler secret put <NAME>` (production) or
# `.dev.vars` (local dev, gitignored) — not here, so this file stays safe to commit.

# Not sensitive (it's the app's own public URL/from-address) — plain vars
# instead of secrets. PUBLIC_APP_URL is the `redirectTo` for employee invite
# emails; must also be allow-listed in Supabase Dashboard -> Authentication ->
# URL Configuration. EMAIL_FROM_ADDRESS must be on a domain verified with Resend.
[vars]
PUBLIC_APP_URL = "https://businessos.ovindupathiraja08.workers.dev"
# The registrable domain shared by the frontend and backend Workers — see
# the COOKIE_DOMAIN comment on the Bindings type in src/lib/supabase.ts for
# why this is the account-level workers.dev subdomain, not either Worker's
# own exact hostname.
COOKIE_DOMAIN = "ovindupathiraja08.workers.dev"
# Sandbox sender (no verified domain yet) — swap to an address on a verified
# Resend domain once one exists; sandbox only delivers to the Resend
# account's own registered email.
EMAIL_FROM_ADDRESS = "Business OS <onboarding@resend.dev>"
# Whether a lapsed subscription actually stops writes (lib/auth.ts). Ships OFF
# so the whole feature can be deployed and watched before it can hurt anyone:
# 20260730010000_platform_billing.sql put every organization that existed when
# it was applied onto a 14-day trial dated from that day, so if that was more
# than two weeks ago, flipping this to "on" without reconciling subscriptions
# first turns EVERY tenant read-only at once. Reconcile, verify with the query
# in Business-os-superadmin/README.md, then `wrangler deploy` with "on".
SUBSCRIPTION_GATE = "off"
